<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F4EDFF">
<title>我用 AI 用成了鼠鼠。。。</title>
<style>:root{--bg:#F4EDFF;--ink:#1D2040;--sub:#5F6385;--line:#D9D2EE;--white:#fff;--mark:#FFE14D;--pink:#FF9DB5;--ac:#7A5CFF;--tint:#EDE7FF;
--sans:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
--serif:"Songti SC","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
--shadow:0 4px 0 var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;background-image:radial-gradient(#E3D8FF 2px,transparent 2.5px);background-size:26px 26px}
#app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;padding:20px 18px 40px;display:flex;flex-direction:column}
button,a,.opt{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3,p{margin:0}
.small{font-size:12.5px;color:var(--sub);line-height:1.6}
/* 气泡 */
.bub{max-width:86%;padding:11px 16px;border-radius:22px;font-size:16px;line-height:1.55;border:2.5px solid var(--ink);box-shadow:var(--shadow)}
.bub.ai{background:var(--white);border-bottom-left-radius:6px;align-self:flex-start}
.bub.me{background:var(--mark);color:var(--ink);border-bottom-right-radius:6px;align-self:flex-end}
.thread{display:flex;flex-direction:column;gap:12px}
.read{align-self:flex-end;font-size:11.5px;color:var(--sub);margin-top:-2px}
/* 首页 */
.hero{padding-top:14px;display:flex;flex-direction:column;gap:18px;flex:1}
.hero h1{font-size:40px;line-height:1.2;font-weight:900;letter-spacing:-.5px;text-align:center}
.hero .sub{font-size:16px;color:var(--sub);text-align:center}
.zoo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pet{background:var(--tint);border:3px solid var(--ink);border-radius:26px;box-shadow:var(--shadow);padding:6px 6px 8px;text-align:center;font-weight:900;font-size:15px;transform:rotate(-2.5deg)}
.pet:nth-child(even){transform:rotate(2.5deg) translateY(4px)}
.pet svg{display:block;width:100%;height:auto}
.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.meta span{background:var(--white);border:2px solid var(--ink);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.btn{display:block;width:100%;background:var(--mark);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:20px;padding:15px 20px;font-size:19px;font-weight:900;text-align:center;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--white)}
.btn.mark{background:var(--pink)}
.btn[disabled]{opacity:.5}
.disc{margin-top:14px;text-align:center}
@keyframes bob{50%{transform:translateY(-6px)}}
/* 答题 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--sub);font-weight:700}
.top .back{padding:8px 4px;font-weight:800;color:var(--ink)}
.top .back[disabled]{opacity:.25}
.bar{height:14px;background:var(--white);border:2.5px solid var(--ink);border-radius:99px;margin:12px 0 30px;position:relative}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .25s}
.walker{position:absolute;top:-17px;width:36px;height:36px;margin-left:-18px;transition:left .25s}
.walker svg{width:100%;height:100%;display:block}
.q{display:flex;flex-direction:column;gap:14px}
.q .bub.ai{font-size:19px;font-weight:800;line-height:1.5;max-width:96%}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.opt{align-self:flex-end;max-width:94%;text-align:left;background:var(--white);border:2.5px solid var(--ink);box-shadow:var(--shadow);border-radius:22px 22px 6px 22px;padding:12px 16px;font-size:16px;line-height:1.5;transition:transform .08s,box-shadow .08s}
.opt.on{background:var(--mark);transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
@media (hover:hover){.opt:hover{background:#FFF8D1}}
/* 计算 */
.calc{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px}
.calc .row{display:flex;gap:8px}.calc .row svg{width:46px;height:46px;animation:bob .9s infinite}
.calc .row svg:nth-child(2n){animation-delay:.2s}.calc .row svg:nth-child(3n){animation-delay:.4s}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:9px;background:var(--ink);opacity:.25;animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:1}}
/* 结果 */
.res{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.badge{font-size:15px;font-weight:800;color:var(--sub);text-align:center}
.pic{width:min(62vw,250px);aspect-ratio:1;margin:0 auto;background:var(--tint);border:3.5px solid var(--ink);border-radius:50%;box-shadow:0 6px 0 var(--ink);transform:rotate(-3deg);display:grid;place-items:center;padding:12px}
.pic svg{width:100%;height:100%;display:block}
.pname{font-size:44px;line-height:1.1;font-weight:900;color:var(--ink);letter-spacing:-1px;text-align:center;-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--ac)}
.tag{font-size:18px;font-weight:800;text-align:center}
.qbox{background:var(--tint);border:3px solid var(--ink);border-radius:24px;padding:18px 16px 12px;display:flex;flex-direction:column;gap:8px}
.qbox .bub{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.55;max-width:100%;background:var(--white);color:var(--ink);border-radius:18px 18px 6px 18px}
.idx{display:flex;align-items:baseline;gap:12px;justify-content:center}
.idx b{font-size:60px;font-weight:900;line-height:1;color:var(--ink)}
.idx span{font-size:15px;font-weight:800;color:var(--sub)}
.meter{height:12px;background:var(--white);border:2.5px solid var(--ink);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ac)}
.trait{font-size:17px;font-weight:800;border-left:6px solid var(--mark);padding-left:12px}
.desc{font-size:16px;color:#33375A;line-height:1.8}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:19px;font-weight:900}
.sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sec li{line-height:1.7}
.sec.card{background:var(--white);border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:24px;padding:18px}
.blind{background:var(--mark);border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:20px;padding:16px 18px;font-weight:800;font-size:17px;line-height:1.65}
.dim{display:grid;grid-template-columns:4.6em 1fr 2.2em;gap:10px;align-items:center;font-size:14px}
.dim b{font-weight:900}.dim .meter{height:12px}.dim span{text-align:right;font-weight:900}
.poll{display:flex;gap:8px}.poll button{flex:1;background:var(--white);border:2.5px solid var(--ink);border-radius:14px;padding:11px 4px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.poll button.on{background:var(--mark);transform:translateY(3px);box-shadow:none}
textarea{width:100%;min-height:84px;border:2.5px solid var(--ink);border-radius:16px;padding:12px;font:inherit;font-size:15px;resize:vertical;background:var(--white)}
/* 弹层 */
.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(29,32,64,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;max-height:92dvh;-webkit-overflow-scrolling:touch;overflow:auto;border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px 28px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:21px;font-weight:900}
.sheet img{width:100%;border-radius:18px;display:block;border:3px solid var(--ink)}
.choice{display:flex;flex-direction:column;gap:10px}.choice button{background:var(--white);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:16px;padding:12px 14px;text-align:left;font-weight:800}
.choice button.on{background:var(--mark);transform:translateY(3px);box-shadow:none}
.dbg{position:fixed;right:8px;bottom:8px;z-index:30;background:#000;color:#0f0;font:11px monospace;padding:6px 8px;border-radius:8px}
pre.log{white-space:pre-wrap;word-break:break-all;font:11px/1.4 monospace;background:#fff;padding:10px;border-radius:10px;max-height:40vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){#app{padding-top:40px}}
/* ===== v3：更可爱生动 + 结果页层级 ===== */
.hero{justify-content:center;gap:20px;padding-top:6px}
@keyframes petA{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(-2.5deg) translateY(-7px)}}
@keyframes petB{0%,100%{transform:rotate(2.5deg) translateY(4px)}50%{transform:rotate(2.5deg) translateY(-3px)}}
.pet{animation:petA 2.8s ease-in-out infinite}.pet:nth-child(even){animation-name:petB}
.ask{display:flex;gap:10px;align-items:flex-end}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:4px;background:#fff}
.avatar svg{width:100%;height:100%;display:block}
.q .ask .bub.ai{flex:1;min-width:0;max-width:none;border-bottom-left-radius:6px}
.badge{font-size:15px}
.note{text-align:center;font-size:14px;color:var(--sub);font-weight:700}
.pic{position:relative}
.pic svg{animation:wiggle 3.4s ease-in-out infinite;transform-origin:50% 80%}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-5deg)}76%{transform:rotate(5deg)}84%{transform:rotate(-3deg)}92%{transform:rotate(0)}}
.st{position:absolute;width:26px;height:26px;background:var(--mark);border:0;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);animation:tw 1.8s ease-in-out infinite}
.st.s1{top:6%;left:2%}.st.s2{top:14%;right:-2%;width:20px;height:20px;background:var(--pink);animation-delay:.5s}.st.s3{bottom:10%;left:-4%;width:18px;height:18px;background:#fff;animation-delay:1s}
@keyframes tw{50%{transform:scale(.55) rotate(25deg);opacity:.7}}
.confetti{position:fixed;top:0;left:0;right:0;height:0;z-index:40;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.sec.card h3{display:inline-block;align-self:flex-start;background:var(--mark);border:2.5px solid var(--ink);border-radius:99px;padding:1px 14px;font-size:17px;transform:rotate(-1.5deg)}
.sec.card.hl{background:var(--tint)}.sec.card.hl h3{background:var(--white)}
.sec.card.good{background:#E9FAF2}.sec.card.good h3{background:#A8F0CF}
.sec.card.tip{background:#FFF8D6}.sec.card.tip h3{background:var(--pink)}
.sec.card ul{margin:0;padding-left:20px}
.whisper{margin-top:4px;padding:10px 14px;background:#fff;border:2.5px dashed var(--ink);border-radius:16px;font-weight:700;font-size:15px}
.idxrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.idxrow b{font-size:54px;line-height:1;font-weight:900}
.idxname{font-weight:900;font-size:16px}
.drow{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.dtop{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline}
.dtop b{font-size:16px;font-weight:900}.dtop .dex{font-size:12.5px;color:var(--sub);font-weight:600}.dtop em{font-style:normal;font-weight:900;font-size:18px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700}
.hint{margin-top:10px}
.divider{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--sub);margin:4px 0}
.divider:before,.divider:after{content:"";flex:1;height:0;border-top:3px dotted var(--ink);opacity:.35}
.pair{display:flex;align-items:center;gap:12px}
.pair .pa{flex:none;width:78px;height:78px;border-radius:50%;border:3px solid var(--ink);background:var(--tint);padding:5px;box-shadow:0 3px 0 var(--ink)}
.pair .pa svg{width:100%;height:100%;display:block}
.btn:before{content:"";}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
</style></head>
<body><div id="app"></div>
<script>
/* 《你的 AI 使用人格》题库 + 评分模型（纯数据 + 纯函数，浏览器和 node 通用） */
const DIMS = {
  R: { name: '放手度', ex: '愿意把任务交给 AI 去做的程度', lo: '自己动手', hi: '放手交给它',
       hiT: '你很擅长把事情真的交出去，省下的时间是实打实的。',
       midT: '你会按事情的轻重，在“自己做”和“交给 AI”之间切换，很灵活。',
       loT: '你习惯自己握着方向盘，把 AI 当参考。这样很稳，也留下了更多可以交给它的空间。' },
  V: { name: '查证度', ex: '会不会核对 AI 说的内容', lo: '更信任它', hi: '爱求证',
       hiT: '你有一道自己的关卡，AI 说的话会先被你认真核对一遍。',
       midT: '你会核对一部分内容。先定好哪几类“一定要查”，会更省力。',
       loT: '你更倾向于信任 AI 的回答，轻松高效。遇到重要内容时多核对一下，会更安心。' },
  C: { name: '掌舵度', ex: '对过程和细节的把控程度', lo: '交给它定', hi: '亲自把关',
       hiT: '你想亲手决定最终的样子，所以成品很有你的味道。',
       midT: '重点环节你亲自把关，次要环节放手，配比刚刚好。',
       loT: '你不太纠结细节，愿意让 AI 来定方向，轻松省心。' },
  E: { name: '尝鲜度', ex: '试新工具、新用法的热情', lo: '用顺手的', hi: '爱尝鲜',
       hiT: '你对新玩法有天然的好奇，总能比别人早一步发现新可能。',
       midT: '有明确好处时你会去试新东西，不盲目追新，也不完全守旧。',
       loT: '你喜欢用顺手的老办法，稳定省心。' },
  L: { name: '打磨度', ex: '和 AI 来回修改、追问的多少', lo: '一两轮搞定', hi: '反复打磨',
       hiT: '你喜欢和 AI 来回多轮，把结果一点点磨到满意。',
       midT: '你会迭代几轮，通常知道什么时候该收手。',
       loT: '你倾向一两轮解决，不行就换个办法，效率很高。' },
  H: { name: '囤货度', ex: '收藏技巧、模板、工具的倾向', lo: '用时现找', hi: '爱囤货',
       hiT: '你收集的方法比用掉的多，见多识广。',
       midT: '你会存一些好用的东西，也会真的拿来用，收藏和使用比较平衡。',
       loT: '你很少囤东西，需要时现想现问，轻装上阵。' }
};
const DIM_KEYS = ['R', 'V', 'C', 'E', 'L', 'H'];

/* 选项写法：['选项文字', 'R3 C1'] 表示该选项给托付度+3、掌控欲+1，负数为反向计分 */
function Q(t, opts) {
  return { t, o: opts.map(([txt, pts]) => {
    const v = {}; String(pts).replace(/([RVCELH])(-?\d)/g, (_, d, n) => { v[d] = +n; });
    return { txt, v };
  }) };
}

const QUESTIONS = [
  Q('周报要交了，你手上只有一堆零散记录。你会：', [
    ['全部丢给 AI，让它直接出完整成稿', 'R3'],
    ['先列好三个重点，再让 AI 按重点展开', 'C2 R1'],
    ['自己写个草稿，让 AI 只负责润色', 'C2 V1 R1'],
    ['让 AI 给几种写法，挑顺眼的再改', 'E2 R1']]),
  Q('AI 给了一段很完整的分析，里面有两个数据没写来源。你会：', [
    ['先用着，有人问再说', 'R3'],
    ['追问 AI：“这个数据哪来的？”', 'V2 L1 R1'],
    ['自己去搜一下核对', 'V3 C1'],
    ['把没把握的删掉，只留我能确认的', 'V2 C1 R-1']]),
  Q('你让 AI 改一段文案，整体不错，但有一句不像你会说的话。你会：', [
    ['直接用，差不多就行', 'R3'],
    ['自己动手把那句改回我的说法', 'C3 R1'],
    ['告诉它“这句不对”，让它再来一轮', 'L3'],
    ['让它再出五版，我从里面拼一个', 'E2 L1 C1']]),
  Q('说到“好用的提示词收藏”，你的情况更接近：', [
    ['存了一大堆，但很少再打开', 'H3'],
    ['有几个常用的，隔段时间会整理', 'H2 C1'],
    ['基本不存，每次现想', 'E1 R1'],
    ['不存提示词，只存好用的结果', 'H1 R1 V1']]),
  Q('周末听说出了个新的 AI 工具，你会：', [
    ['马上注册，十分钟内就玩上了', 'E3'],
    ['先把教程收藏起来，以后再看', 'H3'],
    ['先看看大家怎么评价，值得再试', 'V1 E1'],
    ['手上的够用，不想再换', 'C1 E-1']]),
  Q('你想让 AI 帮忙做一个三天的旅行计划：', [
    ['让它直接出完整行程，照着走', 'R3'],
    ['出完以后，我逐个去查营业时间和路线', 'V3 C1 R1'],
    ['给它一堆条件，不满意就反复调', 'L3 C1'],
    ['我先定好必去的点，让它补空档', 'C3 R1']]),
  Q('AI 连着两次都没理解你的意思，你会：', [
    ['换个说法再试一次', 'L2 E1'],
    ['我自己来更快', 'C3 R-1'],
    ['开个新对话，从头讲清楚', 'L1 C1 E1'],
    ['把前面的内容整理成背景，一起重新发', 'L2 C1 V1']]),
  Q('想入门一个陌生领域（比如理财），你更可能：', [
    ['让 AI 讲一遍，听懂就算', 'R3'],
    ['AI 讲完，再找书或课程对照一下', 'V3'],
    ['让它排一份学习计划，存下来', 'H3'],
    ['边问边学，问到不想问为止', 'L2 E1']]),
  Q('deadline 逼近，AI 给的结果大概是 80 分：', [
    ['够用了，交', 'R3'],
    ['不行，要抠到 95 分才安心', 'C2 L2'],
    ['我自己补上最后那 20 分', 'C3 V1'],
    ['再让它跑几遍，看哪一版更好', 'E2 L1']]),
  Q('同事说“这事让 AI 搞定就行”，你的第一反应是：', [
    ['试试看，说不定真行', 'E2 R1'],
    ['先问清楚“搞定”的标准是什么', 'V3 R1'],
    ['其实我已经在用 AI 搞了，只是没说', 'R2 E1'],
    ['不太放心，还是自己来', 'C2 V1 R-1']]),
  Q('一个下午，你和 AI 在同一个问题上聊了二十多轮：', [
    ['常有的事，改到满意为止', 'L3'],
    ['有点上头，停不下来', 'L3 R1'],
    ['聊到这个程度我会停下来，换个思路', 'C2 E1'],
    ['基本不会，三轮内要么解决要么放弃', 'C1 V1 L-1']]),
  Q('AI 在回答前加了一句：“我不确定，建议你核实。”你会：', [
    ['觉得它挺诚实，反而更信它', 'R1 V1'],
    ['照它说的，去核实一下', 'V3'],
    ['大概率没错，先往下走', 'R3'],
    ['觉得它不如直接给结论', 'C1 V1 R-1']]),

/* ---------- 评分 ---------- */
function dimRanges() {
  const r = {};
  DIM_KEYS.forEach(d => {
    let mn = 0, mx = 0;
    QUESTIONS.forEach(q => {
      const vals = q.o.map(o => o.v[d] || 0);
      mn += Math.min(...vals); mx += Math.max(...vals);
    });
    r[d] = { mn, mx };
  });
  return r;
}
const RANGES = dimRanges();

/* answers: 每题选中的“原始选项下标”数组；未答题不计分。
   得分按“随机作答基线”标准化：均值 50，±2.5 个标准差对应 0/100，
   这样每个维度的 50 分都代表“和随机选差不多”，不同维度之间可比。 */
function baseline(d, answered) {
  let mean = 0, varr = 0;
  QUESTIONS.forEach((q, i) => {
    if (!answered[i]) return;
    const vals = q.o.map(o => o.v[d] || 0);
    const mu = vals.reduce((a, b) => a + b, 0) / vals.length;
    mean += mu;
    varr += vals.reduce((a, b) => a + (b - mu) ** 2, 0) / vals.length;
  });
  return { mean, sd: Math.sqrt(varr) };
}
function scoreAnswers(answers) {
  const answered = QUESTIONS.map((_, i) => answers[i] !== null && answers[i] !== undefined);
  const s = {};
  DIM_KEYS.forEach(d => {
    let raw = 0;
    QUESTIONS.forEach((q, i) => { if (answered[i]) raw += q.o[answers[i]].v[d] || 0; });
    const b = baseline(d, answered);
    s[d] = b.sd === 0 ? 50 : Math.max(0, Math.min(100, Math.round(50 + 20 * (raw - b.mean) / b.sd)));
  });
  return s;
}
function classify(s) {
  const list = Object.keys(PERSONAS).map(id => {
    const t = PERSONAS[id].target;
    const d = Math.sqrt(DIM_KEYS.reduce((a, k) => a + (s[k] - t[k]) ** 2, 0));
    return { id, d };
  }).sort((a, b) => a.d - b.d);
  return { main: list[0].id, second: list[1].id, ranking: list };
}

const mem = {};

  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },

function track(name, props) {
  const ev = Object.assign({ t: Date.now(), name, aid, sid: state && state.sid, src }, props || {});
  const list = loadEvents(); list.push(ev); store.set(KEY_EVENTS, JSON.stringify(list.slice(-600)));
  if (CONFIG.TRACK_URL) {
    try {
      const body = JSON.stringify(ev);
      if (navigator.sendBeacon) navigator.sendBeacon(CONFIG.TRACK_URL, body);

}

const N = QUESTIONS.length;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeOrder(sid) {
  let seed = 0; for (const c of sid) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
  const r = mulberry(seed);
  return QUESTIONS.map(q => {
    const a = q.o.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  });
}
function fresh() {
  const sid = uid();
  return { sid, stage: 'landing', cur: 0, answers: Array(N).fill(null), order: makeOrder(sid), startedAt: 0, result: null, fb: null };
}

}

function render() {
  const st = state.stage;
  $app.innerHTML = st === 'quiz' ? viewQuiz() : st === 'result' ? viewResult() : viewLanding();
  if (CONFIG.DEBUG) { const b = document.createElement('button'); b.className = 'dbg'; b.dataset.act = 'debug'; b.textContent = 'debug'; $app.appendChild(b); }
}

/* ===== 流程 ===== */
let busy = false;
function start() {
  const keepSrc = state;
  state = fresh(); state.stage = 'quiz'; state.startedAt = Date.now(); save();
  track('test_start'); render(); window.scrollTo(0, 0);
}
function pick(oi) {
  if (busy) return; busy = true;
  const i = state.cur; state.answers[i] = oi; save();
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', +b.dataset.oi === oi));
  track('q_answered', { q: i });
  setTimeout(() => {
    if (state.stage !== 'quiz') { busy = false; return; }
    if (i >= N - 1) finish(); else { state.cur = i + 1; save(); render(); window.scrollTo(0, 0); }
    busy = false;
  }, 120);
}
function back() { if (busy || state.cur === 0) return; state.cur--; save(); render(); }
function finish() {
  const miss = state.answers.findIndex(a => a === null);
  if (miss !== -1) { state.cur = miss; save(); render(); return; }
  const scores = scoreAnswers(state.answers), c = classify(scores);
  state.result = { scores, main: c.main, second: c.second };
  track('test_complete', { persona: c.main, second: c.second, sec: Math.round((Date.now() - state.startedAt) / 1000) });
  go('result'); track('result_view', { persona: c.main }); confetti();
}

/* ===== 弹层 ===== */
function sheet(html) {
  closeSheet();
  const m = document.createElement('div'); m.className = 'mask'; m.id = 'mask';
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeSheet(); });
  document.body.appendChild(m);
}
function closeSheet() { const m = document.getElementById('mask'); if (m) m.remove(); }

/* ===== 结果卡片 ===== */
function wrapText(ctx, text, maxW) {
  const lines = []; let line = '';
  for (const ch of text) { if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch; }
  if (line) lines.push(line); return lines;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function loadSvgImage(svg) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
}
async function drawCard() {
  const r = state.result, p = PERSONAS[r.main], s = r.scores;
  const W = 750, H = 1280, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const sans = '"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
  const serif = '"Songti SC","Noto Serif SC","Noto Serif CJK SC",serif';
  const INKC = '#1D2040';
  c.fillStyle = p.tint; c.fillRect(0, 0, W, H);
  // 圆点背景
  c.fillStyle = 'rgba(29,32,64,.06)'; for (let x = 20; x < W; x += 38) for (let y = 20; y < H; y += 38) { c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); }
  // 贴纸卡片
  c.fillStyle = INKC; rr(c, 44, 52, W - 88, H - 88, 48); c.fill();
  c.fillStyle = '#fff'; rr(c, 40, 40, W - 88, H - 88, 48); c.fill(); c.lineWidth = 6; c.strokeStyle = INKC; c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#5F6385'; c.font = `800 30px ${sans}`; c.fillText('我和 AI 的相处方式是……', W / 2 - 4, 120);
  // 大头图
  const cx = W / 2 - 4, cy = 340, R = 168;
  c.fillStyle = INKC; c.beginPath(); c.arc(cx + 2, cy + 8, R, 0, 7); c.fill();
  c.fillStyle = p.tint; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill(); c.lineWidth = 6; c.strokeStyle = INKC; c.stroke();
  const im = await loadSvgImage(art(r.main, 400));
  if (im) c.drawImage(im, cx - 150, cy - 150, 300, 300);
  // 名字
  let fs = 88; c.font = `900 ${fs}px ${sans}`;
  while (c.measureText(p.name).width > W - 200 && fs > 50) { fs -= 4; c.font = `900 ${fs}px ${sans}`; }
  c.fillStyle = p.color; c.fillText(p.name, cx + 4, 600 + 4); c.fillStyle = INKC; c.fillText(p.name, cx, 600);
  c.font = `800 32px ${sans}`; c.fillText(p.tag, cx, 660);
  // 金句气泡
  c.font = `700 38px ${serif}`; const lines = wrapText(c, p.quote, W - 200 - 56);
  const bh = lines.length * 58 + 52, bx = 92, by = 704, bw = W - 184 - 8;
  c.fillStyle = INKC; rr(c, bx + 3, by + 6, bw, bh, 34); c.fill();
  c.fillStyle = p.tint; rr(c, bx, by, bw, bh, 34); c.fill(); c.lineWidth = 5; c.strokeStyle = INKC; c.stroke();
  c.fillStyle = INKC; c.textAlign = 'left'; lines.forEach((l, i) => c.fillText(l, bx + 28, by + 26 + 40 + i * 58));
    // 指数
  const v = p.index.f(s), y0 = by + bh + 40;
  c.fillStyle = INKC; c.font = `900 108px ${sans}`; c.fillText(String(v), 100, y0 + 86);
  const vw = c.measureText(String(v)).width; c.fillStyle = '#5F6385'; c.font = `800 32px ${sans}`; c.fillText(p.index.label, 100 + vw + 20, y0 + 86);
  // 维度条（两条）
  const top = DIM_KEYS.filter(k => k !== p.index.d).sort((a, b) => Math.abs(s[b] - 50) - Math.abs(s[a] - 50)).slice(0, 2);
  top.forEach((d, i) => {
    const y = y0 + 150 + i * 58;
    c.fillStyle = INKC; c.font = `800 28px ${sans}`; c.fillText(DIMS[d].name, 100, y);
    c.fillStyle = '#fff'; rr(c, 240, y - 24, 330, 20, 10); c.fill(); c.lineWidth = 3; c.stroke();
    c.fillStyle = p.color; rr(c, 240, y - 24, Math.max(20, 330 * s[d] / 100), 20, 10); c.fill(); c.stroke();
    c.fillStyle = INKC; c.font = `900 28px ${sans}`; c.textAlign = 'right'; c.fillText(String(s[d]), W - 100, y); c.textAlign = 'left';
  });
  c.textAlign = 'center'; c.fillStyle = '#8A8FAA'; c.font = `600 23px ${sans}`; c.fillText('你是哪只？测测你的 AI 使用人格 · 仅供娱乐', W / 2 - 4, H - 76);
  return cv.toDataURL('image/png');
}
async function openShare() {
  const url = await drawCard(); track('share_card_generate', { persona: state.result.main });
  sheet(`<h3>动物卡片</h3><img src="${url}" alt="你的 AI 使用人格结果卡片"><p class="small">长按图片 → 保存到相册，然后发给搭子～</p>
    ${IN_APP ? '' : `<a class="btn" download="我的AI使用人格.png" href="${url}" data-act="dl">保存图片</a>`}<button class="btn ghost" data-act="close">关闭</button>`);
}

/* ===== 事件 ===== */
$app.addEventListener('click', handle); document.body.addEventListener('click', e => { if (e.target.closest('#mask')) handle(e); });
function handle(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'start') start();
  else if (a === 'pick') pick(+el.dataset.oi);
  else if (a === 'back') back();
  else if (a === 'share') openShare();
  else if (a === 'close') closeSheet();
  else if (a === 'retake') { track('retake'); closeSheet(); start(); }
  else if (a === 'fit') { state.fb = Object.assign({}, state.fb, { fit: el.dataset.v }); save(); document.querySelectorAll('.poll button').forEach(b => b.classList.toggle('on', b === el)); }
  else if (a === 'fbsend') {
    const t = (document.getElementById('fbtext') || {}).value || '';
    if (!state.fb || !state.fb.fit) { const h = document.getElementById('fbhint'); if (h) h.style.display = 'block'; return; }
    state.fb = Object.assign({}, state.fb, { text: t.slice(0, 300), sent: true }); save();
    track('feedback_submit', { persona: state.result.main, fit: state.fb.fit, text: state.fb.text });
    el.disabled = true; el.textContent = '已收到，谢谢你';
  }
  else if (a === 'debug') openDebug();
}
function openDebug() {
  const ev = loadEvents(), cnt = {}; ev.forEach(x => cnt[x.name] = (cnt[x.name] || 0) + 1);
  sheet(`<h3>埋点（本机）</h3><pre class="log">${esc(JSON.stringify(cnt, null, 1))}</pre><pre class="log">${esc(JSON.stringify(ev.slice(-30)))}</pre><button class="btn ghost" data-act="close">关闭</button>`);
}

/* ===== 启动 ===== */
if (['calc', 'free', 'full'].includes(state.stage)) state.stage = state.result ? 'result' : 'landing';
if (state.stage === 'quiz' && state.answers.every(a => a !== null)) { try { finish(); } catch (e) { state = fresh(); } }
if (state.stage === 'result' && !state.result) state = fresh();
render();
track('page_view', { stage: state.stage });
window.__aiper = { get state() { return state; }, events: loadEvents, QUESTIONS, scoreAnswers, classify };

</script></body></html>
